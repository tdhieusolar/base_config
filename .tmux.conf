# --- Cơ bản ---
set -g mouse on                    # Bật chuột để chọn, kéo, copy
set -g history-limit 10000         # Lưu nhiều dòng lịch sử
set -g default-terminal "screen-256color"

# --- Phím tắt ---
unbind C-b                         # Bỏ phím mặc định Ctrl-b
set -g prefix C-a                  # Đổi prefix sang Ctrl-a
bind C-a send-prefix               # Cho phép gửi prefix

# --- Chia cửa sổ ---
bind | split-window -h             # Ctrl-a | chia ngang
bind - split-window -v             # Ctrl-a - chia dọc
bind h select-pane -L              # Di chuyển trái
bind j select-pane -D              # Di chuyển xuống
bind k select-pane -U              # Di chuyển lên
bind l select-pane -R              # Di chuyển phải

# --- Resize ---
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r + resize-pane -U 5
bind -r - resize-pane -D 5

# --- Copy/Paste ---
setw -g mode-keys vi               # Dùng phím vi trong copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# --- Truecolor ---
set-option -ga terminal-overrides ',xterm-256color:Tc'

# --- Thanh trạng thái ---
set -g status-position top
set -g status on
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g status-justify centre
set -g status-bg colour236
set -g status-fg colour136
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39
set -g status-left "#[fg=green]#H #[fg=cyan]| #[fg=yellow]%Y-%m-%d %H:%M"
set -g status-right "#[fg=blue]#(whoami) #[fg=cyan]| #[fg=magenta]%a #[fg=green]%H:%M:%S"

# --- Hiển thị tên cửa sổ ---
setw -g window-status-current-format "#[bg=blue,fg=white] #S:#I:#W #[default]"
setw -g window-status-format "#[fg=grey] #I:#W "

# --- Hiển thị tên pane ---
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# --- Tích hợp plugin (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

bind r source-file ~/.tmux.conf \; display-message "✅ Reloaded tmux.conf!"

# --- Khởi động TPM ---
run '~/.tmux/plugins/tpm/tpm'

